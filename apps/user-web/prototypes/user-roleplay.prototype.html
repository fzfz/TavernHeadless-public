<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>用户端 · TavernHeadless · 角色管理</title>
    <style>
      /* Adapted from WorkspaceViewportFrame, WorkspaceNav, WorkspaceCanvas and WorkspaceInspector. */
      :root {
        color-scheme: dark;
        --bg: #09090b;
        --canvas: #050505;
        --panel: #121215;
        --surface: #18181b;
        --line: rgba(255, 255, 255, 0.09);
        --text: #e4e4e7;
        --muted: #a1a1aa;
        --accent: #2dd4bf;
        font-family: Inter, "Noto Sans SC", system-ui, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--text);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--muted);
        padding: 8px 10px;
        cursor: pointer;
      }
      button:hover {
        background: var(--surface);
        color: white;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .primary {
        background: var(--accent);
        color: #042f2e;
        border-color: var(--accent);
      }
      .primary:hover {
        background: #5eead4;
        color: #042f2e;
      }
      .topbar {
        height: 49px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        font-size: 16px;
        font-weight: 600;
      }
      .brand span {
        font-weight: 300;
        color: var(--muted);
      }
      .mono {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--muted);
      }
      .tag {
        display: inline-block;
        padding: 3px 7px;
        border: 1px solid #2dd4bf40;
        border-radius: 4px;
        color: var(--accent);
        font-size: 11px;
      }
      .workspace {
        display: grid;
        grid-template-columns: 260px minmax(350px, 1fr) 340px;
        min-height: calc(100vh - 49px);
      }
      .sidebar {
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        border-right: 1px solid var(--line);
      }
      .caption {
        font-size: 10px;
        letter-spacing: 1.4px;
        color: #71717a;
        margin: 4px 0 10px;
      }
      .box {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 5px;
        padding: 12px;
      }
      .navitem {
        width: 100%;
        text-align: left;
        display: block;
        margin: 5px 0;
      }
      .active {
        background: #2dd4bf12 !important;
        border-color: #2dd4bf55 !important;
        color: var(--text) !important;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .stack {
        display: grid;
        gap: 9px;
      }
      .small {
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
      }
      .sidebar-footer {
        margin-top: auto;
      }
      .canvas {
        min-width: 0;
        background: var(--canvas);
        display: flex;
        flex-direction: column;
      }
      .session-head {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 17px;
        margin: 0 0 10px;
      }
      h2 {
        font-size: 13px;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.8;
      }
      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .chips span {
        font-size: 11px;
        background: var(--surface);
        padding: 4px 8px;
        border-radius: 4px;
        color: var(--muted);
      }
      .messages {
        flex: 1;
        padding: 28px 28px 50px;
        min-height: 330px;
        max-height: 65vh;
        overflow: auto;
      }
      .message {
        padding: 0 0 24px;
        margin: 0 0 22px;
        border-bottom: 1px solid var(--line);
      }
      .speaker {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .avatar {
        width: 29px;
        height: 29px;
        display: grid;
        place-items: center;
        border: 1px solid #2dd4bf50;
        border-radius: 6px;
        color: var(--accent);
        background: #2dd4bf10;
      }
      .message p {
        margin: 12px 0 0 39px;
        color: #d4d4d8;
        white-space: pre-wrap;
      }
      .composer {
        border-top: 1px solid var(--line);
        padding: 18px 24px;
      }
      .composer textarea {
        width: 100%;
        min-height: 72px;
        resize: vertical;
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--text);
        border-radius: 5px;
        padding: 12px;
      }
      .composer .row {
        margin-top: 10px;
      }
      .inspector {
        border-left: 1px solid var(--line);
        padding-bottom: 16px;
      }
      .tabs {
        display: flex;
        overflow: auto;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        border: 0;
        border-radius: 0;
        padding: 14px 12px;
        white-space: nowrap;
        font-size: 11px;
      }
      .tabs button[aria-selected="true"] {
        border-bottom: 2px solid var(--accent);
        color: var(--accent);
      }
      .inspector-body {
        padding: 18px 16px;
      }
      .field {
        display: block;
        margin: 0 0 15px;
        color: var(--muted);
        font-size: 11px;
      }
      .field select,
      .field input {
        display: block;
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--text);
        padding: 9px;
        margin-top: 7px;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      .feedback {
        margin: 18px 16px 0;
        border-top: 1px solid var(--line);
        padding-top: 13px;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.8;
      }
      .version {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      dialog {
        width: min(540px, 90vw);
        background: var(--bg);
        border: 1px solid #3f3f46;
        color: var(--text);
        border-radius: 8px;
        padding: 22px;
      }
      dialog::backdrop {
        background: #0009;
      }
      .dialog-list {
        margin-top: 18px;
        display: grid;
        gap: 10px;
      }
      .dialog-list button {
        text-align: left;
        padding: 14px;
      }
      .empty {
        padding: 24px 5px;
        color: #71717a;
        font-size: 12px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 1100px) {
        .workspace {
          grid-template-columns: 210px minmax(300px, 1fr);
        }
        .inspector {
          grid-column: 1/-1;
          border-top: 1px solid var(--line);
        }
        .inspector-body {
          max-width: 750px;
        }
        .sidebar {
          grid-row: 1;
        }
      }
      @media (max-width: 640px) {
        .workspace {
          display: block;
        }
        .sidebar {
          border-bottom: 1px solid var(--line);
          display: block;
        }
        .sidebar .box,
        .sidebar-footer {
          margin-bottom: 10px;
        }
        .session-head,
        .composer,
        .messages {
          padding: 18px;
        }
        .topbar {
          padding: 0 12px;
        }
        .topbar .mono {
          font-size: 10px;
        }
      }

      .field textarea {
        display: block;
        width: 100%;
        min-height: 110px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        padding: 12px;
        margin-top: 7px;
        resize: vertical;
        line-height: 1.7;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .toolbar h1,
      .toolbar h2 {
        margin: 0;
        flex: 1;
      }
      .danger {
        color: #fda4af;
      }
      .editor-shell {
        padding: 24px;
        flex: 1;
      }
      .editor-grid {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 24px;
        margin-top: 24px;
      }
      .editor-fields {
        min-width: 0;
      }
      .editor-fields .field {
        font-size: 12px;
      }
      .entry {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 6px 0;
      }
      .entry button:first-child {
        flex: 1;
        text-align: left;
        overflow-wrap: anywhere;
      }
      .resource-card {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .resource-card .actions {
        margin-bottom: 0;
      }
      .binding {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .binding select {
        width: 100%;
        margin: 8px 0;
        background: var(--panel);
        color: var(--text);
        padding: 8px;
        border: 1px solid var(--line);
      }
      .muted {
        color: var(--muted);
      }
      .empty-state {
        padding: 70px 28px;
        text-align: center;
        max-width: 540px;
        margin: auto;
      }
      .empty-state p {
        color: var(--muted);
      }
      #notice {
        position: sticky;
        bottom: 0;
        background: var(--panel);
        padding: 12px 24px;
        min-height: 42px;
        border-top: 1px solid var(--line);
      }
      #library {
        width: min(780px, 92vw);
        max-height: 85vh;
      }
      #dialogError {
        color: #fda4af;
        line-height: 1.7;
      }
      .readonly {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.8;
      }
      .messages {
        max-height: 58vh;
      }
      @media (max-width: 640px) {
        .editor-grid {
          grid-template-columns: 1fr;
        }
        .editor-shell {
          padding: 18px;
        }
        .workspace {
          min-height: 100vh;
        }
      }
      #mainView {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .field input[type="checkbox"] {
        width: auto;
        display: inline-block;
        margin-left: 12px;
      }

      :root {
        --left-width: 250px;
        --right-width: 330px;
      }
      .workspace {
        display: grid;
        grid-template-columns: var(--left-width) 5px minmax(300px, 1fr) 5px var(
            --right-width
          );
      }
      .resize-handle {
        cursor: col-resize;
        background: #202026;
      }
      .resize-handle:hover,
      .resize-handle:focus {
        background: var(--accent);
      }
      .event-list {
        max-height: 220px;
        overflow: auto;
      }
      .table-scroll {
        overflow: auto;
        margin: 16px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        text-align: left;
        padding: 10px;
        border-bottom: 1px solid #34343d;
        vertical-align: top;
      }
      td button {
        margin: 3px;
      }
      td pre {
        max-width: 600px;
        white-space: pre-wrap;
      }
      .markdown-block pre {
        overflow: auto;
      }
      .mobile-toggle {
        display: none;
      }
      [hidden] {
        display: none !important;
      }
      #mainView {
        min-width: 0;
      }
      .topbar {
        height: auto;
        min-height: 54px;
        flex-wrap: wrap;
      }
      .topbar select {
        width: auto;
      }
      .editor-shell {
        overflow: auto;
      }
      .inspector {
        min-width: 0;
      }
      @media (min-width: 1100px) {
        body {
          height: 100dvh;
          overflow: hidden;
          display: flex;
          flex-direction: column;
        }
        .topbar {
          flex-shrink: 0;
        }
        .workspace {
          flex: 1;
          min-height: 0;
          overflow: hidden;
        }
        .sidebar,
        .inspector {
          min-height: 0;
          overflow-y: auto;
        }
        .canvas {
          min-height: 0;
          overflow: hidden;
        }
        #mainView {
          min-height: 0;
          overflow: auto;
        }
        .session-head,
        .composer,
        #notice {
          flex-shrink: 0;
        }
        .messages {
          min-height: 0;
          max-height: none;
        }
      }

      @media (max-width: 1099px) {
        .workspace {
          display: block;
        }
        .resize-handle {
          display: none;
        }
        .mobile-toggle {
          display: inline-block;
        }
        .sidebar,
        .inspector {
          display: none;
          position: fixed;
          top: 62px;
          bottom: 0;
          width: min(90vw, 360px);
          overflow: auto;
          z-index: 20;
          background: #101015;
        }
        .sidebar {
          left: 0;
        }
        .inspector {
          right: 0;
        }
        .sidebar.drawer-open,
        .inspector.drawer-open {
          display: block;
        }
        .canvas {
          min-height: calc(100vh - 64px);
        }
      }

      .generation-detail {
        padding: 24px;
        min-width: 0;
      }
      .generation-header,
      .generation-context,
      .generation-content-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .generation-header h1 {
        font-size: 22px;
        margin: 8px 0 20px;
      }
      .generation-context {
        align-items: flex-end;
      }
      .generation-context label {
        flex: 1;
        margin: 0;
      }
      .generation-status {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 16px 0;
        color: #a1a1aa;
        font-size: 12px;
      }
      .generation-status span:first-child {
        color: #a5b4fc;
      }
      .generation-layout {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 20px;
        border-top: 1px solid #30303b;
        padding-top: 20px;
      }
      .generation-nav {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-self: start;
        position: sticky;
        top: 16px;
      }
      .generation-nav button {
        text-align: left;
        border: 0;
        background: transparent;
        padding: 12px;
      }
      .generation-nav button.active {
        background: #232339;
        color: #c7d2fe;
      }
      .generation-content {
        min-width: 0;
      }
      .generation-content-header {
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .generation-content-header h2 {
        margin: 0;
      }
      .generation-section {
        border: 1px solid #30303b;
        border-radius: 8px;
        margin-bottom: 14px;
        background: #14141b;
        overflow: hidden;
      }
      .generation-section > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
        cursor: pointer;
        list-style: none;
        font-size: 13px;
        font-weight: 600;
      }
      .generation-section > summary::-webkit-details-marker {
        display: none;
      }
      .generation-section small {
        color: #9494a5;
        margin-left: 8px;
        font-weight: 400;
      }
      .generation-disclosure {
        transform: rotate(-90deg);
      }
      .generation-section[open] > summary .generation-disclosure {
        transform: rotate(0);
      }
      .generation-section[open] > summary {
        border-bottom: 1px solid #30303b;
      }
      .generation-section-body {
        padding: 16px;
      }
      .generation-fields {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin: 0 0 18px;
      }
      .generation-fields dt {
        font-size: 11px;
        color: #9292a3;
        margin-bottom: 6px;
      }
      .generation-fields dd {
        font-size: 12px;
        margin: 0;
        overflow-wrap: anywhere;
      }
      .generation-text {
        font:
          12px/1.8 ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 0;
        max-height: 480px;
        overflow: auto;
        user-select: text;
      }
      .generation-text:focus {
        outline: 1px solid #818cf8;
      }
      .generation-missing {
        color: #9090a0;
        font-size: 12px;
        line-height: 1.7;
        padding: 18px;
        border: 1px dashed #353543;
        border-radius: 6px;
        margin: 0;
      }
      .generation-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .generation-pair h3 {
        font-size: 12px;
        margin: 0 0 10px;
      }
      .generation-error {
        padding: 16px;
        background: #351b24;
        border-radius: 6px;
      }
      .generation-timeline {
        list-style: none;
        margin: 0;
        padding-left: 14px;
        border-left: 1px solid #44445a;
      }
      .generation-timeline li {
        padding: 0 0 20px 14px;
      }
      .generation-timeline time {
        color: #9090a0;
        font: 11px monospace;
      }
      .generation-timeline p {
        margin: 6px 0;
        font-size: 13px;
      }
      @media (max-width: 1450px) {
        .generation-layout {
          grid-template-columns: 1fr;
        }
        .generation-nav {
          position: static;
          flex-direction: row;
          overflow: auto;
        }
        .generation-nav button {
          white-space: nowrap;
        }
        .generation-pair {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 640px) {
        .generation-detail {
          padding: 16px;
        }
        .generation-context {
          display: block;
        }
        .generation-fields {
          grid-template-columns: 1fr;
        }
        .generation-context .actions {
          margin-top: 12px;
        }
      }
      .generation-focused .workspace {
        display: block;
      }
      .generation-focused .sidebar,
      .generation-focused .inspector,
      .generation-focused .resize-handle {
        display: none;
      }
      .generation-focused .canvas {
        max-width: 1440px;
        margin: 0 auto;
        border: 0;
      }
      .generation-focused .generation-layout {
        grid-template-columns: 180px minmax(0, 1fr);
      }
      .generation-focused .generation-nav {
        flex-direction: column;
        position: sticky;
      }
      .generation-focused .generation-pair {
        grid-template-columns: 1fr 1fr;
      }
      @media (max-width: 760px) {
        .generation-focused .generation-layout {
          grid-template-columns: 1fr;
        }
        .generation-focused .generation-nav {
          flex-direction: row;
          position: static;
        }
        .generation-focused .generation-pair {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="../../web/prototypes/shared/navigation.prototype.css"
    />
    <link
      rel="stylesheet"
      href="../../web/prototypes/shared/role-view.prototype.css"
    />
  </head>
  <body data-surface="user">
    <header class="topbar">
      <div class="brand">◇ Tavern<span>Headless</span></div>
      <div class="row">
        <span class="tag">管理 Web 端</span
        ><label
          >账号<select id="accountSelect">
            <option>studio-alpha</option>
            <option>studio-beta</option>
          </select></label
        ><button data-r="language" id="languageButton">EN</button
        ><button class="mobile-toggle" data-r="toggle-nav">导航</button
        ><button class="mobile-toggle" data-r="toggle-inspector">检查器</button>
      </div>
    </header>
    <div class="workspace">
      <nav class="sidebar" aria-label="工作区导航">
        <section>
          <div class="caption">角色应用</div>
          <button class="navitem active" id="openApp">
            林岚 · 港口书店 <span class="tag" id="navVersion"></span>
          </button>
          <p class="small">雨夜的港口书店</p>
        </section>
        <section class="box">
          <div class="row">
            <h2>试聊</h2>
            <span id="sessionCount" class="small"></span>
          </div>
          <button id="newTrial" class="navitem">开始试聊</button
          ><label class="field"
            >试聊状态<select id="sessionFilter">
              <option value="active">进行中的试聊</option>
              <option value="archived">已归档的试聊</option>
            </select></label
          >
          <div id="sessionList"></div>
        </section>
        <section class="box">
          <div class="caption">资源库</div>
          <div id="resourceNav"></div>
        </section>
        <section class="box">
          <h2>运行与 Agent</h2>
          <button class="navitem" data-r="tools">工具管理</button
          ><button class="navitem" data-r="mcp">MCP 管理</button
          ><button class="navitem" data-r="variables">变量调试</button
          ><button class="navitem" data-r="memory">记忆调试</button
          ><button class="navitem" data-r="branches">分支与历史</button
          ><button class="navitem" data-r="live-tools">实时工具调用</button>
          <button class="navitem" data-action="open-runtime">
            演绎运行配置</button
          ><button class="navitem" data-action="agent-types">
            工作区 Agent 类型</button
          ><button class="navitem" data-action="agent-bindings">
            项目 Agent
          </button>
        </section>
        <section class="sidebar-footer box">
          <div class="caption">服务配置</div>
          <p class="small">端口、数据库路径和维护周期由服务配置文件维护。</p>
          <button id="deploymentInfo">查看配置位置</button>
        </section>
      </nav>
      <div
        id="leftResize"
        class="resize-handle left"
        role="separator"
        tabindex="0"
        aria-label="调整导航宽度"
      ></div>
      <main class="canvas">
        <div id="mainView"></div>
        <div id="notice" class="small" role="status" aria-live="polite"></div>
      </main>
      <div
        id="rightResize"
        class="resize-handle right"
        role="separator"
        tabindex="0"
        aria-label="调整检查器宽度"
      ></div>
      <aside class="inspector">
        <div class="tabs" aria-label="检查器">
          <button data-tab="bindings" aria-selected="true">配置</button
          ><button data-tab="session">试聊详情</button
          ><button data-tab="debug">生成详情</button>
        </div>
        <div class="inspector-body" id="inspectorContent"></div>
        <section id="workspaceEvents" class="box"></section>
      </aside>
    </div>
    <dialog id="library">
      <div class="toolbar">
        <h2 id="libraryTitle">资源库</h2>
        <button id="closeLibrary">关闭</button>
      </div>
      <div id="libraryActions" class="actions"></div>
      <div id="libraryItems"></div>
    </dialog>
    <dialog id="confirmDialog">
      <h2 id="confirmTitle"></h2>
      <p id="confirmText"></p>
      <label class="field" id="confirmField" hidden
        >名称<input id="confirmInput" maxlength="80"
      /></label>
      <p id="dialogError" role="alert"></p>
      <div class="actions">
        <button id="confirmCancel">取消</button
        ><button class="primary" id="confirmAccept">确认</button>
      </div>
    </dialog>
    <script type="application/json" id="generation-preview-data"></script>
    <script src="../../web/prototypes/shared/scenario-data.prototype.js"></script>
    <input type="file" id="importFile" accept=".json,application/json" hidden />
    <!-- prettier-ignore -->
    <script src="../../web/prototypes/shared/markdown-it.prototype.js"></script>
    <!-- prettier-ignore -->
    <script src="../../web/prototypes/shared/dompurify.prototype.js"></script>
    <script src="../../web/prototypes/shared/workspace.prototype.js"></script>
    <script src="../../web/prototypes/shared/navigation.prototype.js"></script>
    <script src="../../web/prototypes/shared/role-view-schema.prototype.js"></script>
    <script src="../../web/prototypes/shared/role-view-data.prototype.js"></script>
    <script src="../../web/prototypes/shared/novel-view.prototype.js"></script>
    <script src="../../web/prototypes/shared/card-contract.prototype.js"></script>
    <script src="../../web/prototypes/shared/card-runtime.prototype.js"></script>
    <script src="../../web/prototypes/shared/role-view.prototype.js"></script>
    <script src="../../web/prototypes/shared/character-source.prototype.js"></script>
  </body>
</html>
