<section class="screen">
  <img class="backdrop" data-background alt="琴房" /><img
    class="actor"
    data-portrait
    alt="沈遥"
  />
  <header><span>雨后，第二乐章</span><small data-place></small></header>
  <aside data-status hidden>
    <h2>当前状态</h2>
    <p data-state></p>
    <progress data-trust max="100"></progress>
  </aside>
  <div class="narration" data-narration>
    <div class="speaker" data-speaker>沈遥</div>
    <p data-text aria-live="polite"></p>
    <span class="page" data-page></span>
  </div>
  <div class="input-panel" data-input-panel hidden>
    <label
      >你想说些什么？<textarea data-input placeholder="输入你的话"></textarea>
    </label>
    <div><button data-send>发送</button><button data-close>关闭</button></div>
    <p data-feedback role="alert"></p>
  </div>
  <footer>
    <button data-prev title="上一段">◀</button><button data-hide>隐藏</button
    ><button data-music>BGM</button><button data-status-toggle>状态</button
    ><button data-auto title="自动翻页">Auto</button
    ><button data-skip title="跳到当前回复末段">Skip</button
    ><button data-input-open>说话</button><button data-continue>继续剧情</button
    ><button data-next title="下一段">▶</button>
  </footer>
</section>
