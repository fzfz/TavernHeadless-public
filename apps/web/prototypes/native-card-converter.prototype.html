<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TavernHeadless · 自有角色卡转换原型</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --canvas: #050607;
      --panel: #121619;
      --surface: #191f22;
      --line: rgba(255,255,255,.1);
      --text: #e5e7eb;
      --muted: #9ba5a8;
      --accent: #2dd4bf;
      --warning: #fbbf24;
      --danger: #fb7185;
      font: 13px/1.6 Inter, "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, select, textarea { font: inherit; }
    button, select, textarea { color: var(--text); }
    button {
      border: 1px solid var(--line); background: transparent; border-radius: 5px;
      padding: 8px 11px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--surface); border-color: #2dd4bf66; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }
    select, textarea {
      background: #0b0f11; border: 1px solid var(--line); border-radius: 5px; padding: 8px;
      width: 100%;
    }
    textarea { resize: vertical; min-height: 56px; }
    .primary { background: var(--accent); border-color: var(--accent); color: #042f2e; font-weight: 650; }
    .primary:hover:not(:disabled) { background: #5eead4; color: #042f2e; }
    .quiet { color: var(--muted); }
    .topbar {
      min-height: 49px; padding: 8px 22px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-size: 15px; font-weight: 650; letter-spacing: .1px; }
    .brand span { color: var(--muted); font-weight: 400; }
    .top-meta { color: var(--muted); font-size: 11px; }
    .page { max-width: 1460px; margin: 0 auto; padding: 22px; }
    .banner {
      padding: 10px 13px; border: 1px solid #2dd4bf55; border-radius: 6px;
      background: #0b2926; color: #99f6e4; font-weight: 600; letter-spacing: .1px;
    }
    .intro { display: flex; justify-content: space-between; align-items: end; gap: 28px; margin: 22px 0 18px; }
    .eyebrow { color: var(--accent); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin: 3px 0 5px; font-size: clamp(21px, 2.6vw, 29px); line-height: 1.3; }
    h2 { font-size: 14px; margin: 0 0 10px; }
    h3 { font-size: 13px; margin: 0 0 7px; }
    p { margin: 5px 0; }
    .intro p, .small { color: var(--muted); font-size: 12px; }
    .spec-tag, .tag {
      display: inline-flex; align-items: center; border: 1px solid #2dd4bf44; border-radius: 4px;
      padding: 3px 8px; color: var(--accent); font-size: 11px; white-space: nowrap;
    }
    .mode-tabs { display: flex; gap: 7px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
    .mode-tabs button { border-radius: 5px 5px 0 0; border-bottom-color: transparent; white-space: nowrap; color: var(--muted); }
    .mode-tabs button.active { color: var(--text); background: #2dd4bf12; border-color: #2dd4bf55; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    .main-col, .rail { min-width: 0; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 15px; margin-bottom: 12px; }
    .card-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; margin-bottom: 12px; }
    .stepper { display: grid; grid-template-columns: repeat(5, minmax(84px, 1fr)); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 13px; }
    .stepper button { border: 0; border-right: 1px solid var(--line); border-radius: 0; min-height: 57px; text-align: left; padding: 8px 10px; color: var(--muted); }
    .stepper button:last-child { border-right: 0; }
    .stepper button.active { color: var(--text); background: #2dd4bf13; box-shadow: inset 0 -2px var(--accent); }
    .step-num { display: block; color: var(--accent); font: 10px/1.4 ui-monospace, monospace; }
    .step-label { font-size: 11px; white-space: nowrap; }
    .source-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .source-card { text-align: left; min-height: 145px; display: flex; flex-direction: column; gap: 7px; background: #0b0f11; }
    .source-card.selected { border-color: var(--accent); background: #0b2926; }
    .source-card strong { font-size: 13px; color: var(--text); }
    .source-card .small { line-height: 1.55; }
    .source-card .tag { margin-top: auto; align-self: start; }
    .flow-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: end; margin-top: 14px; }
    .status-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-pill { display: inline-flex; gap: 5px; align-items: center; border: 1px solid var(--line); border-radius: 99px; padding: 3px 8px; color: var(--muted); font-size: 10px; }
    .status-pill b { font-size: 11px; color: var(--text); }
    .report-list { display: grid; gap: 9px; }
    .report-item { background: #0b0f11; border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
    .report-item.blocked { border-color: #fb718566; }
    .report-item.resolved { border-color: #2dd4bf4d; }
    .report-title { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
    .report-title h3 { margin: 0; }
    .status { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; white-space: nowrap; }
    .status.direct { color: #86efac; border-color: #86efac55; }
    .status.convertible { color: #67e8f9; border-color: #67e8f955; }
    .status.confirm { color: var(--warning); border-color: #fbbf2455; }
    .status.unsupported, .status.missing { color: var(--danger); border-color: #fb718555; }
    .field-line { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 7px; padding: 5px 0; border-bottom: 1px solid #ffffff09; font-size: 11px; }
    .field-line:last-child { border-bottom: 0; }
    .field-name { color: var(--muted); }
    .field-value { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .code { color: #cbd5e1; font: 10px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .decision { display: grid; grid-template-columns: minmax(180px, .8fr) minmax(200px, 1.2fr) auto; gap: 8px; align-items: end; margin-top: 10px; }
    .decision label { display: block; color: var(--muted); font-size: 10px; margin-bottom: 4px; }
    .decision-note { grid-column: 1 / -1; color: var(--muted); font-size: 10px; }
    .notice { padding: 9px 11px; border: 1px solid var(--line); border-radius: 5px; margin: 10px 0; color: var(--muted); background: #0b0f11; }
    .notice.warn { color: #fde68a; border-color: #fbbf2455; background: #2b2110; }
    .notice.error { color: #fecdd3; border-color: #fb718555; background: #2a1118; }
    .notice.ok { color: #99f6e4; border-color: #2dd4bf55; background: #0b2926; }
    .summary-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
    .summary-cell { padding: 8px; background: #0b0f11; border: 1px solid var(--line); border-radius: 5px; }
    .summary-cell b { display: block; font-size: 17px; }
    .summary-cell span { color: var(--muted); font-size: 10px; }
    .target-tree { display: grid; gap: 7px; }
    .target-node { display: flex; align-items: start; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: #0b0f11; }
    .target-node code { color: var(--accent); font-size: 10px; overflow-wrap: anywhere; }
    .target-node span { color: var(--muted); font-size: 10px; text-align: right; }
    .confirm-row { display: flex; align-items: start; gap: 9px; margin-top: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
    .confirm-row input { accent-color: var(--accent); margin-top: 4px; }
    .confirm-row label { font-size: 11px; }
    .state-rail { position: sticky; top: 12px; }
    .state-list { display: grid; gap: 0; }
    .state-line { display: grid; grid-template-columns: 105px minmax(0,1fr); gap: 7px; padding: 6px 0; border-bottom: 1px solid #ffffff0a; font-size: 10px; }
    .state-line:last-child { border-bottom: 0; }
    .state-line .field-value { color: #d4d4d8; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .quick-actions button { font-size: 10px; padding: 7px; }
    .guide-tabs { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; }
    .guide-tabs button { white-space: nowrap; font-size: 10px; padding: 6px 9px; }
    .guide-tabs button.active { border-color: var(--accent); color: var(--accent); }
    .guide-step { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #ffffff0a; font-size: 11px; }
    .guide-step.current { color: var(--accent); }
    .schema-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .schema-node { border: 1px solid var(--line); border-radius: 5px; padding: 8px; background: #0b0f11; }
    .schema-node code { color: var(--accent); font-size: 10px; }
    .schema-node p { color: var(--muted); font-size: 10px; margin: 3px 0 0; }
    .inline-form { display: grid; gap: 8px; max-width: 650px; }
    .choice-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .choice-row button.active { color: var(--accent); border-color: var(--accent); background: #2dd4bf12; }
    .flow-list { display: grid; gap: 8px; counter-reset: flow; }
    .flow-step { padding: 11px; border: 1px solid var(--line); border-radius: 5px; background: #0b0f11; }
    .flow-step strong { display: block; margin-bottom: 3px; }
    .flow-step p { color: var(--muted); font-size: 11px; margin: 0; }
    .empty { padding: 28px 14px; color: var(--muted); text-align: center; border: 1px dashed var(--line); border-radius: 5px; }
    .footnote { color: var(--muted); font-size: 10px; line-height: 1.7; }
    .download-link { color: var(--accent); }
    @media (max-width: 980px) {
      .layout { grid-template-columns: minmax(0, 1fr) 260px; }
      .decision { grid-template-columns: 1fr 1fr; }
      .decision button { grid-column: 2; justify-self: end; }
    }
    @media (max-width: 700px) {
      .page { padding: 14px 12px 30px; }
      .topbar { padding: 8px 12px; }
      .top-meta { display: none; }
      .intro { display: block; margin: 18px 0 13px; }
      .intro .spec-tag { margin-top: 8px; }
      .layout { display: flex; flex-direction: column; }
      .main-col, .rail { width: 100%; }
      .state-rail { position: static; }
      .source-grid { grid-template-columns: 1fr; }
      .source-card { min-height: 116px; }
      .stepper { grid-template-columns: repeat(5, minmax(67px, 1fr)); overflow-x: auto; }
      .stepper button { min-width: 67px; padding: 7px 5px; }
      .step-label { font-size: 9px; white-space: normal; line-height: 1.35; }
      .step-num { font-size: 9px; }
      .summary-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .field-line { grid-template-columns: 83px minmax(0, 1fr); }
      .decision { grid-template-columns: 1fr; }
      .decision button { grid-column: auto; justify-self: stretch; }
      .schema-grid { grid-template-columns: 1fr; }
      .card { padding: 12px; }
    }
    @media (max-width: 390px) {
      :root { font-size: 12px; }
      .page { padding: 10px 9px 24px; }
      .banner { font-size: 11px; padding: 8px 9px; }
      .stepper button { min-width: 60px; }
      .state-line { grid-template-columns: 90px minmax(0, 1fr); }
      .field-line { grid-template-columns: 75px minmax(0, 1fr); }
    }
  </style>
</head>

  <header class="topbar">
    <div class="brand">TavernHeadless <span>· 原型</span></div>
    <div class="top-meta">本地交互演示　/　内存状态　/　无服务连接</div>
  </header>
  <main class="page">
    <div class="banner" id="notice-banner">设计原型 · 内置示例 · 不读取真实卡片，不写入资源库</div>
    <section class="intro">
      <div>
        <div class="eyebrow">正式目标格式提案 · tavern_headless_card 1.0.0</div>
        <h1>角色卡转换工作台</h1>
        <p>这个交互原型用来确认：转换器能否把原文、来源证据、决策原因和目标位置逐项连起来，并阻止未解决项或过期报告进入下载。正式目标结构仅作设计提案展示；本页下载使用独立的演示包装格式，不声明符合正式 1.0.0。</p>
      </div>
      <span class="spec-tag">提案：tavern_headless_card 1.0.0</span>
    </section>
    <nav class="mode-tabs" id="mode-tabs" aria-label="工作流程"></nav>
    <div class="layout">
      <section class="main-col" id="main-view" aria-live="polite"></section>
      <aside class="rail">
        <section class="card state-rail" id="state-panel" aria-live="polite"></section>
        <section class="card" id="quick-panel"></section>
        <section class="card" id="guide-panel"></section>
      </aside>
    </div>
  </main>

  <script>
    "use strict";
    const CONFIG = JSON.parse(document.getElementById("prototype-config").textContent);
    const emptyConversion = () => ({step:1, sourceId:null, repaired:false, repairedDependencies:[], reportRevision:0, decisionRevision:0, decisions:{}, preview:null, finalConfirmation:null, generated:null, notice:"", noticeType:""});
    const initialState = () => ({mode:"convert", conversion:emptyConversion(), importFlow:{sampleId:"valid", inspection:null, choice:"", result:null}, exportFlow:{sampleId:"complete", check:null, downloaded:false}, guide:{scenarioId:"normal", step:0, started:false}});

    // Pure state transition module. It receives only plain state/actions and never reads the DOM.
    function reducer(state, action) {
      const c = state.conversion;
      const withNotice = (next, message, type="") => ({...next, conversion:{...next.conversion, notice:message, noticeType:type}});
      switch (action.type) {
        case "SET_MODE": return {...state, mode:action.mode};
        case "SELECT_SOURCE": {
          const source = getSource(action.sourceId);
          if (!source) return state;
          const rev = c.reportRevision + 1;
          const invalidPreview = c.preview ? {...c.preview, valid:false, invalidatedReason:"源已重新选择，报告版本变化。"} : null;
          const nextC = {...emptyConversion(), sourceId:source.id, step:2, repaired:false, reportRevision:rev, decisionRevision:c.decisionRevision+1, preview:invalidPreview, notice:`已选择 ${source.name}，报告版本 R${rev}。旧确认和预览已失效。`, noticeType:"warn"};
          return {...state, mode:"convert", conversion:nextC, guide:{...state.guide, started:false}};
        }
        case "REPAIR_SOURCE": {
          if (c.sourceId !== CONFIG.repair.sourceId || c.repaired) return withNotice(state, "当前源没有可执行的示例修复。", "warn");
          const old = c.preview ? {...c.preview, valid:false, invalidatedReason:"示例源已修复并重新检查。"} : null;
          const rev = c.reportRevision + 1;
          const nextC = {...emptyConversion(), sourceId:c.sourceId, repaired:true, repairedDependencies:c.repairedDependencies, step:2, reportRevision:rev, decisionRevision:c.decisionRevision+1, preview:old, notice:CONFIG.labels.repairDone, noticeType:"ok"};
          return {...state, conversion:nextC};
        }
        case "REPAIR_DEPENDENCY": {
          const item = getItems(c).find(x => x.id === action.itemId);
          if (!item || item.status !== "missing" || c.repairedDependencies.includes(item.id)) return withNotice(state, "当前报告没有可补齐的缺失示例资源。", "warn");
          const old = c.preview ? {...c.preview, valid:false, invalidatedReason:"已模拟补齐缺失依赖并重新检查。"} : null;
          const rev = c.reportRevision + 1;
          const nextC = {...emptyConversion(), sourceId:c.sourceId, repaired:c.repaired, repairedDependencies:[...c.repairedDependencies,item.id], step:2, reportRevision:rev, decisionRevision:c.decisionRevision+1, preview:old, notice:CONFIG.labels.dependencyRepaired, noticeType:"ok"};
          return {...state, conversion:nextC};
        }
        case "DECIDE_ITEM": {
          const item = getItems(c).find(x => x.id === action.itemId);
          if (!item) return state;
          if (item.status === "unsupported" && item.required) return withNotice(state, CONFIG.labels.requiredCannotSkip, "error");
          if (item.status === "missing" && action.choice === "convert") return withNotice(state, "缺失资源不能直接采用映射。请模拟补齐依赖并重检，或填写原因后明确移出依赖子树。", "error");
          if (action.choice === "exclude" && !String(action.reason || "").trim()) return withNotice(state, CONFIG.labels.reasonRequired, "error");
          if (action.choice === "exclude" && !item.canExclude) return withNotice(state, "此项没有可排除的依赖子树。", "error");
          if (action.choice !== "convert" && action.choice !== "exclude") return state;
          const nextDecision = {choice:action.choice, reason:String(action.reason || "").trim(), confirmedForRevision:c.reportRevision};
          const preview = c.preview ? {...c.preview, valid:false, invalidatedReason:"逐项决策已修改。"} : null;
          const nextC = {...c, decisions:{...c.decisions, [item.id]:nextDecision}, decisionRevision:c.decisionRevision+1, preview, finalConfirmation:null, generated:null, notice:`${item.name} 已记录为「${action.choice === "convert" ? CONFIG.labels.decision.convert : CONFIG.labels.decision.exclude}」，绑定报告 R${c.reportRevision}。旧预览已失效。`, noticeType:"ok"};
          return {...state, conversion:nextC};
        }
        case "GO_STEP": {
          if (action.step < 1 || action.step > 5) return state;
          if (!c.sourceId && action.step > 1) return withNotice(state, CONFIG.labels.emptySource, "warn");
          if (action.step >= 4 && getBlockers(state).length) return withNotice(state, CONFIG.labels.blockedPreview, "error");
          if (action.step === 5 && !isCurrentPreview(state)) return withNotice(state, CONFIG.labels.stalePreview, "error");
          if (action.step === 5 && !isConfirmed(state)) return withNotice(state, "先确认当前报告版本，才能进入完成步骤。", "warn");
          return {...state, conversion:{...c, step:action.step}};
        }
        case "PREVIEW": {
          const blockers = getBlockers(state);
          if (blockers.length) return withNotice(state, `${CONFIG.labels.blockedPreview} 阻塞 ${blockers.length} 项。`, "error");
          const preview = createPreview(state);
          return {...state, conversion:{...c, step:4, preview, finalConfirmation:null, generated:null, notice:CONFIG.labels.previewDone, noticeType:"ok"}};
        }
        case "FINAL_CONFIRM": {
          if (!isCurrentPreview(state)) return withNotice(state, CONFIG.labels.stalePreview, "error");
          return {...state, conversion:{...c, finalConfirmation:{reportRevision:c.reportRevision, decisionRevision:c.decisionRevision}, notice:`已确认报告 R${c.reportRevision} / 决策 D${c.decisionRevision}。`, noticeType:"ok"}};
        }
        case "CLEAR_CONFIRM": return {...state, conversion:{...c, finalConfirmation:null, generated:null, notice:"已撤销最终确认。", noticeType:"warn"}};
        case "GENERATE": {
          if (!isCurrentPreview(state) || !isConfirmed(state)) return withNotice(state, CONFIG.labels.stalePreview + " 需要重新生成预览并确认版本。", "error");
          const card = buildOwnCard(state);
          return {...state, conversion:{...c, step:5, generated:{filename:`${slug(card.card.character.name)}-tavern-headless-card-demo.json`, payload:card}, notice:CONFIG.labels.downloadDone, noticeType:"ok"}};
        }
        case "RESET_CONVERSION": return {...state, mode:"convert", conversion:emptyConversion(), guide:{...state.guide, started:false}};
        case "GUIDE_SELECT": return {...initialState(), guide:{scenarioId:action.scenarioId, step:0, started:true}};
        case "GUIDE_STEP": {
          const guide = CONFIG.guides.find(x => x.id === state.guide.scenarioId);
          if (!guide || !state.guide.started) return state;
          const item = guide.steps[state.guide.step];
          if (!item) return state;
          const advanced = reducer(state, item.action);
          return {...advanced, guide:{...advanced.guide, scenarioId:guide.id, step:state.guide.step+1, started:true}};
        }
        case "IMPORT_SELECT": return {...state, mode:"import", importFlow:{sampleId:action.sampleId, inspection:null, choice:"", result:null}};
        case "IMPORT_INSPECT": {
          const sample = CONFIG.importSamples.find(x => x.id === state.importFlow.sampleId);
      const issues = [];
          if (sample.spec !== CONFIG.spec.name) issues.push(`只接受 ${CONFIG.spec.name} 格式。请改选正确格式的自有卡包，再次检查。`);
          if (sample.version !== CONFIG.spec.version) issues.push("当前版本不受支持。当前仅接受 tavern_headless_card 1.0.0；请选兼容版本并重新检查。");
          if (!sample.dependenciesClosed) issues.push("包内媒体依赖缺失。请补齐缺失文件，再点“检查示例包”重新检查；依赖闭合后才能导入。");
          const conflict = !!sample.existing && sample.existing.id === sample.incoming.id;
          return {...state, importFlow:{...state.importFlow, inspection:{valid:issues.length===0, issues, conflict, sampleId:sample.id}, result:null}, mode:"import"};
        }
        case "IMPORT_CHOICE": return {...state, importFlow:{...state.importFlow, choice:action.choice, result:null}};
        case "IMPORT_APPLY": {
          const f = state.importFlow;
          if (!f.inspection || !f.inspection.valid) return {...state, importFlow:{...f, result:{ok:false, text:"包检查未通过，导入演示已阻止。"}}};
          if (f.inspection.conflict && !["copy","new-version"].includes(f.choice)) return {...state, importFlow:{...f, result:{ok:false, text:"检测到 ID 冲突，请选择创建副本或导入新版本。"}}};
          const text = f.inspection.conflict ? (f.choice === "copy" ? "演示：将创建一个新 ID 的副本。" : "演示：将同一角色 ID 导入为新版本。") : "演示：包已通过检查，可作为新资源导入。";
          return {...state, importFlow:{...f, result:{ok:true, text: text + " 本原型不会写入资源库。"}}};
        }
        case "EXPORT_SELECT": return {...state, mode:"export", exportFlow:{sampleId:action.sampleId, check:null, downloaded:false}};
        case "EXPORT_CHECK": {
          const sample = CONFIG.exportSamples.find(x => x.id === state.exportFlow.sampleId);
          const issues = sample.dependenciesClosed ? [] : ["固定版本的媒体依赖未闭合：缺少 portrait.webp。请补入该文件或重新选择完整示例，再点“检查固定版本与依赖”复检。"];
          return {...state, mode:"export", exportFlow:{...state.exportFlow, check:{ok:issues.length===0, issues, sampleId:sample.id}, downloaded:false}};
        }
        case "EXPORT_DOWNLOAD": {
          const f = state.exportFlow;
          if (!f.check || !f.check.ok) return state;
          return {...state, mode:"export", exportFlow:{...f, downloaded:true}};
        }
        default: return state;
      }
    }

    function getSource(id) { return CONFIG.sources.find(x => x.id === id); }
    function getItems(c) {
      const source = getSource(c.sourceId);
      if (!source) return [];
      let items = source.items.map(x => ({...x}));
      if (c.sourceId === CONFIG.repair.sourceId && c.repaired) {
        items = items.filter(x => x.id !== CONFIG.repair.removeItemId);
        items.push({...CONFIG.repair.addItem});
      }
      return items.map(item => c.repairedDependencies.includes(item.id) ? {...item,status:"direct",action:"已模拟补齐依赖并重检，保留媒体占位记录。",evidence:item.evidence + " 演示已模拟依赖重检通过；媒体内容仍为占位记录。"} : item);
    }
    function getBlockers(state) {
      const c = state.conversion;
      if (!c.sourceId) return ["未选择源示例"];
      return getItems(c).filter(item => {
        if (item.status === "direct") return false;
        if (item.status === "unsupported" && item.required) return true;
        const decision = c.decisions[item.id];
        if (item.status === "missing") return !decision || decision.choice !== "exclude" || !decision.reason.trim() || decision.confirmedForRevision !== c.reportRevision;
        return !decision || decision.confirmedForRevision !== c.reportRevision;
      });
    }
    function isCurrentPreview(state) {

    }
    function renderExport() {
      const f=state.exportFlow, sample=CONFIG.exportSamples.find(x=>x.id===f.sampleId), check=f.check;
      $("main-view").innerHTML=`<section class="card"><div class="card-head"><div><h2>导出自有卡</h2><p class="small">导出前固定角色、世界书和媒体的资源版本，检查所有引用依赖，再下载自有完整包结构示例 JSON；媒体内容使用占位记录。</p></div><span class="tag">独立流程</span></div><div class="source-grid">${CONFIG.exportSamples.map(s=>`<button class="source-card ${f.sampleId===s.id?"selected":""}" data-export-sample="${s.id}"><strong>${escapeHtml(s.name)}</strong><span class="small">${escapeHtml(s.description)}</span><span class="tag">${escapeHtml(s.version)}</span></button>`).join("")}</div><div class="flow-actions"><button class="primary" data-action="EXPORT_CHECK">${escapeHtml(CONFIG.labels.actions.checkExport)}</button></div>${check?`<div class="card" style="margin-top:12px"><h2>固定版本与依赖清单</h2>${field("角色 / 世界书 / 媒体",sample.version,true)}${field("依赖闭合",sample.dependenciesClosed?"是":"否")}${check.issues.length?notice(check.issues.join(" "),"error"):notice("资源版本已固定，依赖闭合。可下载完整包结构示例 JSON。", "ok")}<div class="flow-actions"><button data-action="EXPORT_DOWNLOAD" ${check.ok?"":"disabled"}>${escapeHtml(CONFIG.labels.actions.downloadExport)}</button></div>${f.downloaded?notice("完整包结构示例 JSON 已触发本地下载；媒体为占位记录。","ok"):""}</div>`:""}<p class="footnote">${escapeHtml(CONFIG.labels.exportNoWrite)}</p></section>${renderSchemaCard()}`;
    }
    document.addEventListener("click",event=>{
      const target=event.target.closest("button"); if(!target)return;
      if(target.dataset.mode){dispatch({type:"SET_MODE",mode:target.dataset.mode});return;}
      if(target.dataset.source){dispatch({type:"SELECT_SOURCE",sourceId:target.dataset.source});return;}
      if(target.dataset.repairDependency){dispatch({type:"REPAIR_DEPENDENCY",itemId:target.dataset.repairDependency});return;}
      if(target.dataset.step){dispatch({type:"GO_STEP",step:Number(target.dataset.step)});return;}
      if(target.dataset.action){dispatch({type:target.dataset.action,step:target.dataset.step?Number(target.dataset.step):undefined});return;}
      if(target.dataset.saveDecision){
        const id=target.dataset.saveDecision, choice=$("choice-"+id)?.value, reason=$("reason-"+id)?.value||"";
        dispatch({type:"DECIDE_ITEM",itemId:id,choice,reason}); return;
      }
      if(target.dataset.guideReset){dispatch({type:"GUIDE_SELECT",scenarioId:target.dataset.guideReset});return;}
      if(target.hasAttribute("data-guide-step")){dispatch({type:"GUIDE_STEP"});return;}
      if(target.dataset.guide){dispatch({type:"GUIDE_SELECT",scenarioId:target.dataset.guide});return;}
      if(target.dataset.importSample){dispatch({type:"IMPORT_SELECT",sampleId:target.dataset.importSample});return;}
      if(target.dataset.importChoice){dispatch({type:"IMPORT_CHOICE",choice:target.dataset.importChoice});return;}
      if(target.dataset.exportSample){dispatch({type:"EXPORT_SELECT",sampleId:target.dataset.exportSample});return;}
      if(target.hasAttribute("data-download-again")&&state.conversion.generated)downloadJson(state.conversion.generated.filename,state.conversion.generated.payload);
    });
    document.addEventListener("change",event=>{
      if(event.target.matches("[data-final-confirm]")){dispatch({type:event.target.checked?"FINAL_CONFIRM":"CLEAR_CONFIRM"});}
    });

    render();
  </script>
</body>
</html>
